[package]
authors = ["jerry4718 <jerry4718@qq.com>"]
edition = "2024"
name = "napi-winit"
version = "0.2.101"

[lib]
crate-type = ["cdylib"]

[workspace]
members = [ "crates/proc" ]

[workspace.dependencies]

[dependencies]
proc = { path = "crates/proc" }
threadpool = "1.8.1"

[dependencies.winit]
version = "0.31.0-beta.3"

[dependencies.tokio]
version = "1.53.1"
features = ["time"]
# features = [ "rt", "rt-multi-thread","time" ]

[dependencies.rwh_06]
package = "raw-window-handle"
version = "0.6.2"
features = ["std"]

[dependencies.napi]
version = "3.12.2"
default-features = false
# see https://nodejs.org/api/n-api.html#node-api-version-matrix
features = ["napi6", "async"]

[dependencies.napi-derive]
version = "3.6.3"
features = ["type-def"]

[dependencies.softbuffer]
version = "0.4.8"
default-features = false
features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.0"
[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.0"

#[target.'cfg(not(target_env = "msvc"))'.dependencies.jemallocator]
#version = "0.3.2"
#features = ["disable_initial_exec_tls"]

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
